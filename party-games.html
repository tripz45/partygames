<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Party Games</title>
<style>
:root{--bg:#f1edff;--ink:#17142b;--card:#fff;--blue:#3b2bff;--lime:#c8ff3d;--mut:#6b6788;--ad:#e2dcfa;--line:#cfc7f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14112a;--ink:#f1edff;--card:#201c40;--blue:#8c82ff;--lime:#c8ff3d;--mut:#a9a4cf;--ad:#1d1a38;--line:#3a3466}}
:root[data-theme="dark"]{--bg:#14112a;--ink:#f1edff;--card:#201c40;--blue:#8c82ff;--lime:#c8ff3d;--mut:#a9a4cf;--ad:#1d1a38;--line:#3a3466}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
h1,h2,h3{font-family:"Arial Black","Segoe UI",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
header{text-align:center;padding:20px 64px 4px}
header h1{font-size:clamp(1.8rem,5vw,2.8rem)}
header p{margin:4px 0 0;color:var(--mut)}
.lang{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:5;display:flex;align-items:center;gap:4px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:4px 8px 4px 10px;box-shadow:3px 3px 0 var(--blue)}
.lang select{border:none;background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.lang select option{color:#17142b;background:#fff}
.layout{padding:0 16px;max-width:680px;margin:0 auto}
main{flex:1;min-width:0;max-width:640px;min-height:520px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}
.game{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:20px;text-align:left;cursor:pointer;font:inherit;color:inherit;box-shadow:6px 6px 0 var(--blue)}
.game:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--blue)}
.game:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.game h2{font-size:1.5rem;margin-bottom:6px}
.game p{margin:0;color:var(--mut)}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:24px;margin-top:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0}
.row label{font-weight:700}
.stepper{display:flex;align-items:center;gap:12px}
.stepper span{min-width:2ch;text-align:center;font-size:1.6rem;font-weight:800}
.stepper button{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font-size:1.4rem;cursor:pointer}
.btn{display:block;width:100%;padding:16px;border:3px solid var(--ink);border-radius:14px;background:var(--lime);color:#17142b;font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);margin-top:10px}
.back{background:none;border:none;color:var(--blue);font:inherit;font-weight:700;cursor:pointer;padding:0}
.reveal{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;border-radius:14px;padding:20px;margin:14px 0;background:var(--bg)}
.reveal .who{color:var(--mut);font-weight:700}
.reveal .word{font-size:clamp(2rem,9vw,3rem);font-family:"Arial Black",system-ui,sans-serif;word-break:break-word}
.reveal .word.imp{color:#e0245e}
.hint{color:var(--mut);font-size:.9rem;margin:0}
.hidden{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{padding:8px 14px;border:2px solid var(--ink);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}.chip.on{background:var(--lime);color:#17142b}.opt{display:block;width:100%;padding:24px;margin-top:12px;border:3px solid var(--ink);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;font-weight:800;font-size:1.15rem;cursor:pointer}.opt.on{background:var(--lime);color:#17142b}
.theme{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;z-index:5;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--blue);cursor:pointer;font-size:1.1rem}
</style>
</head>
<body>
<label class="lang">🌐 <select id="lang" aria-label="Language"><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option></select></label>

<button class="theme" id="theme" aria-label="Theme">🌓</button>
<header>
  <h1 data-t="title">Party Games</h1>
  <p data-t="sub"></p>
</header>


<div class="layout">
  
  <main>
    <section id="home">
      <div class="games">
        <button class="game" id="open-imposter"><h2 data-t="impT"></h2><p data-t="impD"></p></button>
        <button class="game" id="open-charades"><h2 data-t="actT"></h2><p data-t="actD"></p></button>
        <button class="game" id="open-wyr"><h2 data-t="wyrT"></h2><p data-t="wyrD"></p></button>
        <button class="game" id="open-td"><h2 data-t="truT"></h2><p data-t="truD"></p></button>
        <button class="game" id="open-dice"><h2 data-t="diceT"></h2><p data-t="diceD"></p></button>
        <button class="game" id="open-hot"><h2 data-t="hotT"></h2><p data-t="hotD"></p></button>
      </div>
    </section>

    <section id="setup" class="panel hidden">
      <button class="back" data-home data-t="back"></button>
      <h2 style="margin-top:10px" data-t="impT"></h2>
      <div class="chips" id="cats" role="group"></div>
      <div class="row">
        <label data-t="players"></label>
        <div class="stepper"><button id="p-minus" aria-label="-">&minus;</button><span id="p-val">4</span><button id="p-plus" aria-label="+">+</button></div>
      </div>
      <div class="row">
        <label data-t="imps"></label>
        <div class="stepper"><button id="i-minus" aria-label="-">&minus;</button><span id="i-val">1</span><button id="i-plus" aria-label="+">+</button></div>
      </div>
      <button class="btn" id="start" data-t="start"></button>
    </section>

    <section id="play" class="panel hidden">
      <div id="turn">
        <div class="reveal" id="card"></div>
        <button class="btn" id="action"></button>
      </div>
      <div id="done" class="hidden">
        <div class="reveal">
          <div class="word" data-t="done"></div>
          <p class="hint" data-t="doneH"></p>
          <p class="word" id="starter" style="font-size:1.3rem"></p>
        </div>
        <button class="btn" id="again" data-t="again"></button>
        <button class="btn alt" data-home data-t="all"></button>
      </div>
    </section>

    <section id="charades" class="panel hidden">
      <button class="back" data-home data-t="back"></button>
      <h2 style="margin-top:10px" data-t="actT"></h2>
      <div class="reveal"><div class="who" id="c-info"></div><div class="word" id="c-word"></div></div>
      <button class="btn" id="c-start"></button>
      <div id="c-run" class="hidden"><button class="btn" id="c-got" data-t="got"></button><button class="btn alt" id="c-skip" data-t="skip"></button></div>
    </section>

    <section id="wyr" class="panel hidden">
      <button class="back" data-home data-t="back"></button>
      <h2 style="margin-top:10px" data-t="wyrT"></h2>
      <button class="opt" id="w-a"></button>
      <button class="opt" id="w-b"></button>
      <button class="btn alt" id="w-next" data-t="next"></button>
    </section>
    <section id="truth" class="panel hidden">
      <button class="back" data-home data-t="back"></button>
      <h2 style="margin-top:10px" data-t="truT"></h2>
      <div class="reveal"><div class="word" id="td-out" data-t="tdH"></div></div>
      <button class="btn" id="td-t" data-t="truth"></button>
      <button class="btn alt" id="td-d" data-t="dare"></button>
    </section>

    <section id="dice" class="panel hidden">
      <button class="back" data-home data-t="back"></button>
      <h2 style="margin-top:10px" data-t="diceT"></h2>
      <div class="reveal"><div class="word" id="d-out" data-t="dH"></div></div>
      <button class="btn" id="d-roll" data-t="roll"></button>
      <button class="btn alt" id="d-flip" data-t="flip"></button>
    </section>

    <section id="hot" class="panel hidden">
      <button class="back" data-home data-t="back"></button>
      <h2 style="margin-top:10px" data-t="hotT"></h2>
      <div class="reveal" id="h-card"><div class="word" id="h-word"></div></div>
      <button class="btn" id="h-btn" data-t="hotGo"></button>
    </section>
  </main>

  </div>

/* Imposter */
let players=4,imps=1,roles=[],wIdx=0,idx=0,shown=false,started=false,cat=-1;
const maxImps=()=>Math.max(1,Math.floor((players-1)/2));
function sync(){imps=Math.min(imps,maxImps());$("p-val").textContent=players;$("i-val").textContent=imps}
function chips(){const box=$("cats");box.innerHTML="";t("cats").split(",").forEach((n,i)=>{const b=document.createElement("button");b.className="chip"+(i-1===cat?" on":"");b.textContent=n;b.onclick=()=>{cat=i-1;chips()};box.appendChild(b)})}
$("open-imposter").onclick=()=>{sync();show("setup")};
$("p-minus").onclick=()=>{players=Math.max(3,players-1);sync()};
$("p-plus").onclick=()=>{players=Math.min(20,players+1);sync()};
$("i-minus").onclick=()=>{imps=Math.max(1,imps-1);sync()};
$("i-plus").onclick=()=>{imps=Math.min(maxImps(),imps+1);sync()};
$("start").onclick=()=>{
  wIdx=cat<0?rnd(tot):ST[cat]+rnd(AW.en[cat].length);
  roles=Array.from({length:players},(_,i)=>i<imps);
  for(let i=roles.length-1;i>0;i--){const j=rnd(i+1);[roles[i],roles[j]]=[roles[j],roles[i]]}
  idx=0;shown=false;started=true;show("play");$("turn").classList.remove("hidden");$("done").classList.add("hidden");render();
};
function render(){
  if(!started)return;
  const card=$("card"),btn=$("action");
  if(!shown){
    card.innerHTML='<div class="who">'+t("pOf",{n:idx+1,m:players})+'</div><div class="word">'+t("ready")+'</div><p class="hint">'+t("secret")+'</p>';
    btn.textContent=t("show");
  }else{
    const imp=roles[idx];
    card.innerHTML='<div class="who">'+t("your",{n:idx+1})+'</div><div class="word'+(imp?' imp':'')+'">'+(imp?t("impW"):FL[lang][wIdx])+'</div>';
    btn.textContent=t("hide");
  }
}
$("action").onclick=()=>{
  if(!shown){shown=true;render();return}
  shown=false;idx++;
  if(idx>=players){$("starter").textContent="🎯 "+t("starts",{n:rnd(players)+1});buzz();$("turn").classList.add("hidden");$("done").classList.remove("hidden");return}
  render();
};
$("again").onclick=()=>show("setup");

/* Act It Out */
let cScore=0,cT=0,cTimer=null,cState="idle",cIdx=0;
function cRender(){
  const w=$("c-word"),i=$("c-info"),s=$("c-start");
  if(cState==="idle"){w.textContent=t("ready");i.textContent=t("actInfo");s.textContent=t("round")}
  else if(cState==="run"){w.textContent=FL[lang][cIdx];i.textContent=t("left",{s:cT,c:cScore})}
  else{w.textContent=t("up");i.textContent=t("fin",{c:cScore});s.textContent=t("nr")}
}
$("open-charades").onclick=()=>{clearInterval(cTimer);cState="idle";$("c-run").classList.add("hidden");$("c-start").classList.remove("hidden");cRender();show("charades")};
$("c-start").onclick=()=>{
  cScore=0;cT=60;cState="run";cIdx=rnd(tot);$("c-start").classList.add("hidden");$("c-run").classList.remove("hidden");cRender();
  clearInterval(cTimer);
  cTimer=setInterval(()=>{cT--;if(cT<=0){clearInterval(cTimer);cState="end";$("c-run").classList.add("hidden");$("c-start").classList.remove("hidden")}cRender()},1000);
};
$("c-got").onclick=()=>{cScore++;cIdx=rnd(tot);cRender()};
$("c-skip").onclick=()=>{cIdx=rnd(tot);cRender()};

/* Would You Rather */
let wi=-1;
function wShow(){if(wi<0)return;const q=QQ[lang][wi];$("w-a").textContent=q[0];$("w-b").textContent=q[1]}
function wNext(){let n;do{n=rnd(QQ.en.length)}while(n===wi);wi=n;wShow();$("w-a").classList.remove("on");$("w-b").classList.remove("on")}
$("open-wyr").onclick=()=>{wNext();show("wyr")};
$("w-a").onclick=()=>{$("w-a").classList.add("on");$("w-b").classList.remove("on")};
$("w-b").onclick=()=>{$("w-b").classList.add("on");$("w-a").classList.remove("on")};
$("w-next").onclick=wNext;

/* Truth or Dare */
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p||60)}catch(e){}}
function tdGo(k){const a=TDQ[lang][k];$("td-out").textContent=a[rnd(a.length)]}
$("open-td").onclick=()=>{$("td-out").textContent=t("tdH");show("truth")};
$("td-t").onclick=()=>tdGo(0);$("td-d").onclick=()=>tdGo(1);
/* Dice & Coin */
$("open-dice").onclick=()=>{$("d-out").textContent=t("dH");show("dice")};
$("d-roll").onclick=()=>{$("d-out").textContent="🎲 "+(rnd(6)+1);buzz()};
$("d-flip").onclick=()=>{$("d-out").textContent=t(rnd(2)?"heads":"tails");buzz()};
/* Hot Potato */
let hT=null;
function hStop(){clearTimeout(hT);const c=$("h-card");c.style.background="";c.style.color="";$("h-btn").classList.remove("hidden")}
$("open-hot").onclick=()=>{hStop();$("h-word").textContent="🥔";show("hot")};
$("h-btn").onclick=()=>{
  hStop();$("h-word").textContent="🥔 "+t("hotPass");$("h-btn").classList.add("hidden");
  hT=setTimeout(()=>{const c=$("h-card");c.style.background="#e0245e";c.style.color="#fff";$("h-word").textContent="💥 "+t("hotBoom");buzz([200,80,300]);$("h-btn").classList.remove("hidden")},8000+rnd(17000));
};
/* Theme */
try{const s=localStorage.getItem("theme");if(s)document.documentElement.dataset.theme=s}catch(e){}
$("theme").onclick=()=>{const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark";try{localStorage.setItem("theme",r.dataset.theme)}catch(e){}};
/* Language */
function applyLang(){
  document.documentElement.lang=lang;document.title=t("title");
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  $("lang").value=lang;chips();render();cRender();wShow();
}
$("lang").onchange=e=>{lang=e.target.value;try{localStorage.setItem("lang",lang)}catch(x){}applyLang()};
applyLang();
</script>
</body>
</html>
